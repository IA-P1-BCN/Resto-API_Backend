name: deploy

# Push a main → tests (ci.yml) → deploy en Render (solo si los tests pasan) → comprobación de /health.
# Requiere:
#   - Secret   RENDER_DEPLOY_HOOK_URL  (Render → Settings → Deploy Hook)
#   - Variable RENDER_URL              (p. ej. https://restoapi.onrender.com)
#   - Secret   JWT_SECRET_KEY_TEST     (cualquier valor, solo para tests)
#   - Variable COVERAGE_MIN (opcional) (cobertura mínima; 70 al final del proyecto)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-render:
    needs: tests
    runs-on: ubuntu-latest
    environment: production
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_URL: ${{ vars.RENDER_URL }}
    steps:
      - name: Disparar deploy en Render
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL no configurado: se omite el deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy lanzado en Render."
      - name: Comprobar /health
        if: env.HOOK != '' && env.RENDER_URL != ''
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$RENDER_URL/health"; then exit 0; fi
            echo "Esperando a Render ($i/20)..."; sleep 15
          done
          echo "::error::$RENDER_URL/health no responde"; exit 1
