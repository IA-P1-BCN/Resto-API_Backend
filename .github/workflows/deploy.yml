name: deploy

# Push a main → tests (ci.yml) → deploy en Render (solo si los tests pasan) → espera a que /health sirva este commit.
# Requiere:
#   - Secret   RENDER_DEPLOY_HOOK_URL  (Render → Settings → Deploy Hook)
#   - Variable RENDER_URL              (p. ej. https://restoapi.onrender.com)
#   - Secret   JWT_SECRET_KEY_TEST     (cualquier valor, solo para tests)
#   - Variable COVERAGE_MIN (opcional) (cobertura mínima; 70 al final del proyecto)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-render:
    needs: tests
    runs-on: ubuntu-latest
    environment: production
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_URL: ${{ vars.RENDER_URL }}
    steps:
      - name: Disparar deploy en Render
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL no configurado: se omite el deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy lanzado en Render."
      - name: Comprobar que Render sirve este commit
        if: env.HOOK != '' && env.RENDER_URL != ''
        # Mientras Render construye, /health sigue respondiendo la versión anterior:
        # solo se da por bueno cuando devuelve el commit que se acaba de desplegar.
        run: |
          for i in $(seq 1 40); do
            commit=$(curl -fsS "$RENDER_URL/health" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Render sirve $GITHUB_SHA"; exit 0
            fi
            echo "Esperando a Render ($i/40): sirve '${commit:-sin respuesta}'"; sleep 15
          done
          echo "::error::$RENDER_URL no sirve $GITHUB_SHA tras 10 minutos"; exit 1
