name: deploy

# Push a main → tests → deploy en Render (solo si los tests pasan) → comprobación de /health.
# Requiere:
#   - Secret   RENDER_DEPLOY_HOOK_URL  (Render → Settings → Deploy Hook)
#   - Variable RENDER_URL              (p. ej. https://restoapi.onrender.com)
#   - Secret   JWT_SECRET_KEY_TEST     (cualquier valor, solo para tests)
#   - Variable COVERAGE_MIN (opcional) (cobertura mínima; 70 al final del proyecto)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: restoapi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/restoapi_test
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_TEST || 'test-secret' }}
      ENVIRONMENT: test
      EMAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      # Los pasos siguientes se activan solos en cuanto existan Alembic, los tests y el Dockerfile.
      - if: hashFiles('alembic.ini') != ''
        run: alembic upgrade head
      - if: hashFiles('tests/**/*.py') != ''
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=${{ vars.COVERAGE_MIN || 0 }}
      - if: hashFiles('Dockerfile') != ''
        run: docker build -t restoapi-backend .

  deploy-render:
    needs: tests
    runs-on: ubuntu-latest
    environment: production
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_URL: ${{ vars.RENDER_URL }}
    steps:
      - name: Disparar deploy en Render
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL no configurado: se omite el deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy lanzado en Render."
      - name: Comprobar /health
        if: env.HOOK != '' && env.RENDER_URL != ''
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$RENDER_URL/health"; then exit 0; fi
            echo "Esperando a Render ($i/20)..."; sleep 15
          done
          echo "::error::$RENDER_URL/health no responde"; exit 1
