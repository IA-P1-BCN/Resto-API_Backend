# Stack completo en local: API + PostgreSQL 16 + frontend.
#
# Requisito: los dos repos clonados en la misma carpeta:
#   P2_Resto/
#   ├── Resto-API_Backend/   ← aquí está este fichero
#   └── Resto-API_Frontend/
# (o indicar otra ruta con FRONTEND_PATH en el .env)
#
#   docker compose up --build      → http://localhost:5173 (web) · http://localhost:8000/docs (API)
#   docker compose down            → parar   ·   docker compose down -v → parar y borrar la BD
#
# Variables opcionales (en el .env de esta carpeta):
#   DB_PORT=5433          → si el 5432 está ocupado por un Postgres instalado en el equipo
#   VITE_USE_MOCK=true    → el frontend usa datos simulados en vez de la API

name: restoapi

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: restoapi
      POSTGRES_PASSWORD: restoapi
      POSTGRES_DB: restoapi
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restoapi -d restoapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Dentro de Docker la BD es el servicio "db", no localhost
      DATABASE_URL: postgresql+psycopg://restoapi:restoapi@db:5432/restoapi
      ENVIRONMENT: development
      ALLOWED_ORIGINS: http://localhost:5173
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-cambiar-en-produccion-0000}
      EMAIL_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ${FRONTEND_PATH:-../Resto-API_Frontend}
      args:
        # El navegador llama a la API desde el host, por eso localhost
        VITE_API_URL: http://localhost:8000
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db-data:
