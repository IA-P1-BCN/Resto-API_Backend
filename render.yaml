# Render Blueprint — servicio web de la API (FastAPI).
# Render → New → Blueprint → seleccionar este repo. Los valores con "sync: false"
# se piden en el dashboard al crear el servicio (nunca se escriben aquí).
services:
  - type: web
    name: restoapi
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    # Aplica las migraciones solo si ya existe alembic.ini (igual que en Docker)
    startCommand: sh docker-entrypoint.sh
    healthCheckPath: /health
    # El deploy lo lanza GitHub Actions (deploy.yml) solo si los tests pasan.
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: JWT_SECRET_KEY
        generateValue: true
      # Límite de intentos de login (HU-31). La IP real llega en True-Client-IP (Cloudflare);
      # se comprueba en el log "Login blocked" tras el deploy (paso 6 de la HU).
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_WINDOW_MINUTES
        value: "15"
      - key: CLIENT_IP_HEADER
        value: True-Client-IP
      # Cambiar a "true" cuando Brevo esté configurado (HU-19, D7).
      - key: EMAIL_ENABLED
        value: "false"
      - key: DATABASE_URL # Neon, rama main (pooled, sslmode=require)
        sync: false
      - key: ALLOWED_ORIGINS # URL de producción de Vercel
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FRONTEND_URL # URL de producción de Vercel, base del enlace de HU-52
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Keep-awake estilo woke-dyno: un hilo pide la URL pública cada N min
      # para que el plan gratuito no se duerma (~15 min sin tráfico). Solo
      # la URL es secreta de este despliegue: se rellena a mano.
      - key: KEEP_AWAKE_ENABLED
        value: "false"
      - key: KEEP_AWAKE_URL
        sync: false # p.ej. https://restoapi-47sp.onrender.com/health
      - key: KEEP_AWAKE_MINUTES
        value: "10"
